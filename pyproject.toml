[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "alembic/versions",
    ".pytest_tmp",
    ".pytest_tmp-tests",
    ".venv",
    "venv",
    ".review-day4",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line too long (formatted by ruff format)
    "UP046",  # PEP 695 generic class syntax (keep Generic[T] for pydantic & mypy stability)
    "UP047",  # PEP 695 generic function syntax
]

[tool.mypy]
python_version = "3.12"
plugins = [
    "pydantic.mypy",
]
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = false
strict_optional = true
ignore_missing_imports = false
exclude = [
    "^alembic/",
    "^venv/",
    "^\\.venv/",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false
